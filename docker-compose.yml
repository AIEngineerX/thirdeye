services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: thirdeye-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thirdeye}:${POSTGRES_PASSWORD:-thirdeye}@postgres:5432/${POSTGRES_DB:-thirdeye}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PUBLIC_INSTANCE_MODE: ${PUBLIC_INSTANCE_MODE:-false}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_PROXY_LIMIT: ${HELIUS_PROXY_LIMIT:-600}
      HELIUS_PROXY_WINDOW_SEC: ${HELIUS_PROXY_WINDOW_SEC:-3600}
    ports:
      - "3001:3001"

  postgres:
    image: postgres:16-alpine
    container_name: thirdeye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thirdeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thirdeye}
      POSTGRES_DB: ${POSTGRES_DB:-thirdeye}
    ports:
      - "5432:5432"
    volumes:
      - thirdeye-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thirdeye} -d ${POSTGRES_DB:-thirdeye}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  thirdeye-pg-data:
